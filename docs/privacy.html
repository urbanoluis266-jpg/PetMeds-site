<h1>PetMeds 隐私政策</h1>
<p class="muted">最后更新：2026 年</p>
<p>PetMeds 是一个完全离线的记录工具。我们不做账号体系，不收集你的个人信息。</p>
<h2>我们收集什么</h2>
<p>不收集。你输入的所有内容（记录、条目、设置）只保存在你自己的手机里。</p>
<h2>网络与第三方</h2>
<p>App 不发起任何网络请求，不接入统计、广告或推送 SDK。</p>
<h2>权限</h2>
<p>App 不申请相机、相册、定位、通讯录等权限。</p>
<h2>数据删除</h2>
<p>删除 App 即删除全部数据；我们没有任何副本。</p>
<h2>联系我们</h2>
<p>如有疑问请写信至 <a href="mailto:2467342427@qq.com">2467342427@qq.com</a>。</p>
